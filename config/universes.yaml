# RRG Monitor — universe definitions
#
# Each universe is a set of securities measured against a single benchmark.
# The exporter (rrg/export.py, Phase 1) reads this file and writes one
# docs/data/<id>.json per universe, conforming to docs/data/schema.json.
#
# tickers : the securities plotted as dots on the RRG
# benchmark : the reference the RS-Ratio / RS-Momentum are computed against
# names : optional human-readable labels shown in tooltips / standings

universes:
  sectors:
    label: "SPDR Sectors"
    benchmark: SPY
    description: "The 11 S&P 500 sector SPDR ETFs, rotated against the S&P 500."
    tickers: [XLK, XLC, XLY, XLP, XLE, XLF, XLV, XLI, XLB, XLRE, XLU]
    names:
      XLK: "Technology"
      XLC: "Communication Services"
      XLY: "Consumer Discretionary"
      XLP: "Consumer Staples"
      XLE: "Energy"
      XLF: "Financials"
      XLV: "Health Care"
      XLI: "Industrials"
      XLB: "Materials"
      XLRE: "Real Estate"
      XLU: "Utilities"

  mag7:
    label: "Magnificent 7"
    benchmark: SPY
    description: "The seven mega-cap growth leaders, rotated against the S&P 500."
    tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA]
    names:
      AAPL: "Apple"
      MSFT: "Microsoft"
      NVDA: "NVIDIA"
      AMZN: "Amazon"
      GOOGL: "Alphabet"
      META: "Meta Platforms"
      TSLA: "Tesla"

  global:
    label: "Global / Asset Classes"
    # NOTE (Phase-0 sub-decision, unconfirmed): benchmark defaults to ACWI
    # (MSCI All-Country World). Alternatives under review: SPY, or an
    # equal-weight blend. Changing the benchmark changes what
    # "leading / lagging" means for this view — confirm before launch.
    benchmark: ACWI
    description: "Major asset classes and regions, rotated against global equities (ACWI)."
    tickers: [SPY, EFA, EEM, TLT, IEF, GLD, DBC, VNQ]
    names:
      SPY: "US Equities"
      EFA: "Developed ex-US"
      EEM: "Emerging Markets"
      TLT: "Long Treasuries"
      IEF: "Intermediate Treasuries"
      GLD: "Gold"
      DBC: "Broad Commodities"
      VNQ: "US Real Estate"

  factors:
    label: "Factors & Styles"
    benchmark: SPY
    description: "Equity factor and style ETFs, rotated against the S&P 500 — the factor-timing view."
    tickers: [MTUM, QUAL, VLUE, USMV, IWF, IWD, IWM]
    names:
      MTUM: "Momentum"
      QUAL: "Quality"
      VLUE: "Value"
      USMV: "Minimum Volatility"
      IWF: "Growth (Large-Cap)"
      IWD: "Value (Large-Cap)"
      IWM: "Small-Cap"

  regions:
    label: "Global Regions"
    benchmark: ACWI
    description: "Country and regional equity markets, rotated against global equities (ACWI)."
    tickers: [SPY, VGK, EWJ, EEM, MCHI, INDA, EWZ, EWU]
    names:
      SPY: "United States"
      VGK: "Europe"
      EWJ: "Japan"
      EEM: "Emerging Markets"
      MCHI: "China"
      INDA: "India"
      EWZ: "Brazil"
      EWU: "United Kingdom"

  fixed_income:
    label: "Fixed Income"
    benchmark: AGG
    description: "Treasury duration and credit sectors, rotated against the US Aggregate bond index (AGG)."
    tickers: [SHY, IEF, TLT, TIP, LQD, HYG, EMB, MBB, BKLN]
    names:
      SHY: "1-3Y Treasuries"
      IEF: "7-10Y Treasuries"
      TLT: "20+Y Treasuries"
      TIP: "TIPS"
      LQD: "IG Corporates"
      HYG: "High Yield"
      EMB: "EM Bonds"
      MBB: "Mortgage-Backed"
      BKLN: "Bank Loans"

  commodities:
    label: "Commodities"
    benchmark: DBC
    description: "Major commodities, rotated against a broad commodity index (DBC) — the real-asset view."
    tickers: [GLD, SLV, USO, UNG, DBA, DBB, URA]
    names:
      GLD: "Gold"
      SLV: "Silver"
      USO: "Crude Oil"
      UNG: "Natural Gas"
      DBA: "Agriculture"
      DBB: "Base Metals"
      URA: "Uranium"
